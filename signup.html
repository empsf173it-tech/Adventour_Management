<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Adventour</title>
  <meta name="description" content="Create a new Adventour account.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.jpg">
</head>
<body>

  <!-- Signup Section -->
  <section class="auth-wrapper">
    <!-- Theme Toggle Button Top Right -->
    <button id="themeToggle" class="theme-toggle position-absolute top-0 end-0 m-4 z-3" aria-label="Toggle theme">
      <i class="bi bi-moon-fill"></i>
    </button>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 animate-up-target">
          <div class="feature-card p-5 position-relative">
            <div class="text-center mb-4 mt-3">
              <div class="mb-2"><a href="index.html" class="brand-logo text-decoration-none"><i class="bi bi-geo-alt-fill"></i>Adventour</a></div>
              <h2 class="fw-bold">Create Account</h2>
              <p class="text-muted">Join us and start your journey.</p>
            </div>
            <form>
              <div class="mb-3">
                <label for="name" class="form-label fw-bold">Full Name</label>
                <input type="text" class="form-control form-control-lg" id="name" placeholder="John Doe" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email address</label>
                <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-bold">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control form-control-lg border-end-0" id="password" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary border-start-0 bg-transparent text-muted" type="button" id="togglePassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label small text-muted" for="terms">I agree to the <a href="#">Privacy Policy & Terms</a></label>
              </div>
              <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">Sign Up</button>
              
              <div class="text-center my-3 text-muted">OR</div>
              
              <div class="d-flex justify-content-center gap-3 mb-4">
                <button type="button" class="btn btn-outline-secondary rounded-circle p-2" style="width:45px;height:45px;">
                  <i class="bi bi-google"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary rounded-circle p-2" style="width:45px;height:45px;">
                  <i class="bi bi-facebook"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary rounded-circle p-2" style="width:45px;height:45px;">
                  <i class="bi bi-twitter-x"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary rounded-circle p-2" style="width:45px;height:45px;">
                  <i class="bi bi-apple"></i>
                </button>
              </div>
              
              <div class="text-center">
                <p class="mb-0">Already have an account? <a href="login.html" class="fw-bold text-primary">Log in</a></p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('togglePassword').addEventListener('click', function () {
      const password = document.getElementById('password');
      const icon = this.querySelector('i');
      if (password.type === 'password') {
        password.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        password.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
  </script>
</body>
</html>
